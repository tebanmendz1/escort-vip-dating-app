version: '3.8'

services:
  app:
    build: .
    container_name: escort_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - PERSISTENT_DATA_DIR=/data
      - UPLOADS_DIR=/data/uploads
      - DATABASE_URL=postgresql://escort_user:escort_password@postgres:5432/escort_db?schema=public
      - JWT_SECRET=super-secret-escort-vps-key
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=escorts-data
      - MINIO_SECRET_KEY=minioadminpassword
      - MINIO_BUCKET_NAME=escort-media
      - MINIO_PUBLIC_URL=
    depends_on:
      - postgres
      - minio
    volumes:
      - app_data:/data

  postgres:
    image: postgres:16-alpine
    container_name: escort_postgres
    restart: always
    environment:
      POSTGRES_USER: escort_user
      POSTGRES_PASSWORD: escort_password
      POSTGRES_DB: escort_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: escort_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: escorts-data
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
  app_data:
