<!DOCTYPE html>
<html lang="es">
<head>
	<title>Registro de Escorts | Plataforma VIP</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, minimal-ui, viewport-fit=cover">
	<meta name="theme-color" content="#FF50A2">
	<link rel="shortcut icon" type="image/x-icon" href="assets/images/favicon.png">
	<link rel="manifest" href="manifest.json">
	<link href="assets/vendor/bootstrap-select/dist/css/bootstrap-select.min.css" rel="stylesheet">
	<link rel="stylesheet" class="main-css" type="text/css" href="assets/css/style.css">
	<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="body-bg2">
	<div class="page-wrapper">

		<!-- Header -->
		<header class="header header-fixed border-0">
			<div class="container">
				<div class="header-content">
					<div class="left-content">
						<a href="index.html" class="back-btn">
							<i class="fa-solid fa-arrow-left font-18 text-dark"></i>
						</a>
					</div>
					<div class="mid-content">
						<h5 class="title mb-0">Registro de Escorts</h5>
					</div>
					<div class="right-content">
						<a href="escort-login.html" class="text-primary font-14 font-w600">Iniciar Sesión</a>
					</div>
				</div>
			</div>
		</header>

		<!-- Content -->
		<div class="page-content space-top space-bottom">
			<div class="container">
				<div class="card border-0 shadow-sm mb-4">
					<div class="card-body p-4">
						<div class="text-center mb-4">
							<h3 class="font-w700 text-dark">Únete como Proveedor</h3>
							<p class="text-muted font-14">Crea tu perfil profesional para ofrecer tus servicios de acompañante (Mujeres, Hombres y Trans).</p>
						</div>

						<div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

						<form id="registerForm">
							<div class="mb-3">
								<label class="form-label font-w600">Nombre de Artista / Perfil *</label>
								<input type="text" class="form-control" id="name" placeholder="Ej. Valeria Deluxe" required>
							</div>

							<div class="row">
								<div class="col-6 mb-3">
									<label class="form-label font-w600">Género / Identidad *</label>
									<select class="form-select" id="gender" required>
										<option value="FEMALE">Mujer</option>
										<option value="MALE">Hombre</option>
										<option value="TRANS">Trans</option>
										<option value="NON_BINARY">No Binario</option>
										<option value="GAY">Gay</option>
										<option value="LESBIAN">Lesbiana</option>
										<option value="BISEXUAL">Bisexual</option>
									</select>
								</div>
								<div class="col-6 mb-3">
									<label class="form-label font-w600">Edad *</label>
									<input type="number" class="form-control" id="age" value="22" min="18" max="70" required>
								</div>
							</div>

							<div class="row">
								<div class="col-6 mb-3">
									<label class="form-label font-w600">Nacionalidad *</label>
									<select class="form-select" id="nationality" required>
										<option value="Mexicana">Mexicana 🇲🇽</option>
										<option value="Colombiana">Colombiana 🇨🇴</option>
										<option value="Venezolana">Venezolana 🇻🇪</option>
										<option value="Argentina">Argentina 🇦🇷</option>
										<option value="Española">Española 🇪🇸</option>
										<option value="Brasileña">Brasileña 🇧🇷</option>
										<option value="Chilena">Chilena 🇨🇱</option>
										<option value="Peruana">Peruana 🇵🇪</option>
										<option value="Ecuatoriana">Ecuatoriana 🇪🇨</option>
										<option value="Uruguaya">Uruguaya 🇺🇾</option>
										<option value="Paraguaya">Paraguaya 🇵🇾</option>
										<option value="Boliviana">Boliviana 🇧🇴</option>
										<option value="Costarricense">Costarricense 🇨🇷</option>
										<option value="Cubana">Cubana 🇨🇺</option>
										<option value="Dominicana">Dominicana 🇩🇴</option>
										<option value="Salvadoreña">Salvadoreña 🇸🇻</option>
										<option value="Guatemalteca">Guatemalteca 🇬🇹</option>
										<option value="Hondureña">Hondureña 🇭🇳</option>
										<option value="Nicaragüense">Nicaragüense 🇳🇮</option>
										<option value="Panameña">Panameña 🇵🇦</option>
										<option value="Puertorriqueña">Puertorriqueña 🇵🇷</option>
										<option value="Otra">Otra Nacionalidad 🌎</option>
									</select>
								</div>
								<div class="col-6 mb-3">
									<label class="form-label font-w600">Tipo de Cuerpo *</label>
									<select class="form-select" id="bodyType" required>
										<option value="Atlética">Atlética</option>
										<option value="Delgada">Delgada</option>
										<option value="Curvy">Curvy</option>
										<option value="Normal">Normal</option>
									</select>
								</div>
							</div>

							<div class="form-check form-switch mb-3">
								<input class="form-check-input" type="checkbox" id="requestVerificationCheck" checked>
								<label class="form-check-label font-w600 text-dark" for="requestVerificationCheck">
									Solicitar Insignia "Verificado ✔️" (Recomendado para obtener mayor visibilidad)
								</label>
							</div>

							<div class="mb-3">
								<label class="form-label font-w600">Correo Electrónico *</label>
								<input type="email" class="form-control" id="email" placeholder="tu-correo@ejemplo.com" required>
							</div>

							<div class="mb-3">
								<label class="form-label font-w600">Contraseña *</label>
								<input type="password" class="form-control" id="password" placeholder="Mínimo 6 caracteres" required>
							</div>

							<div class="row">
								<div class="col-6 mb-3">
									<label class="form-label font-w600">Ciudad *</label>
									<input type="text" class="form-control" id="city" placeholder="Ej. Ciudad de México" required>
								</div>
								<div class="col-6 mb-3">
									<label class="form-label font-w600">Zona / Col.</label>
									<input type="text" class="form-control" id="zone" placeholder="Ej. Polanco / Condesa">
								</div>
							</div>

							<div class="row">
								<div class="col-6 mb-3">
									<label class="form-label font-w600">Tarifa por Hora ($) *</label>
									<input type="number" class="form-control" id="hourlyRate" placeholder="150" value="150" required>
								</div>
								<div class="col-6 mb-3">
									<label class="form-label font-w600">WhatsApp Directo *</label>
									<input type="tel" class="form-control" id="whatsapp" placeholder="+525512345678" required>
								</div>
							</div>

							<div class="mb-3">
								<label class="form-label font-w600">Servicios Ofrecidos</label>
								<input type="text" class="form-control" id="services" placeholder="Acompañante VIP, Cenas, Eventos, Viajes">
							</div>

							<div class="mb-3">
								<label class="form-label font-w600">Descripción / Biografía</label>
								<textarea class="form-control" id="bio" rows="3" placeholder="Cuéntale a tus clientes sobre ti, tu elegancia y tus servicios..."></textarea>
							</div>

							<button type="submit" class="btn btn-primary w-100 py-3 font-16 font-w600 rounded-pill">
								Crear Perfil de Escort
							</button>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>

	<script src="assets/js/jquery.js"></script>
	<script type="module" src="assets/js/escort-api.js"></script>
	<script type="module">
		import { EscortAPI } from './assets/js/escort-api.js';

		document.getElementById('registerForm').addEventListener('submit', async (e) => {
			e.preventDefault();
			const alertBox = document.getElementById('alertBox');
			alertBox.classList.add('d-none');

			const data = {
				name: document.getElementById('name').value,
				gender: document.getElementById('gender').value,
				age: document.getElementById('age').value,
				nationality: document.getElementById('nationality').value,
				bodyType: document.getElementById('bodyType').value,
				email: document.getElementById('email').value,
				password: document.getElementById('password').value,
				city: document.getElementById('city').value,
				zone: document.getElementById('zone').value,
				hourlyRate: document.getElementById('hourlyRate').value,
				whatsapp: document.getElementById('whatsapp').value,
				phone: document.getElementById('whatsapp').value,
				services: document.getElementById('services').value,
				bio: document.getElementById('bio').value
			};

			try {
				await EscortAPI.register(data);
				window.location.href = 'escort-dashboard.html';
			} catch (err) {
				alertBox.textContent = err.message;
				alertBox.classList.remove('d-none');
			}
		});
	</script>
</body>
</html>
